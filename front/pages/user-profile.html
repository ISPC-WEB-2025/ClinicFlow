<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>

		<link rel="stylesheet" href="../css/styles.css" />
		<link rel="stylesheet" href="../css/userProfile.css" />

		<title>Mi Perfil | ClinicFlow</title>
	</head>
	<body class="bg-light">
		<!-- HEADER -->
		<header
			class="navbar navbar-expand-lg navbar-light fixed-top"
			id="header-placeholder"
		></header>

		<!-- MAIN -->
		<main>
			<!-- BANNER -->
			<section id="profile-banner">
				<img src="../img/banner.png" alt="Banner perfil de usuario" />
				<div class="profile-banner-overlay">
					<h1 class="profile-banner-title">Mi Perfil</h1>
				</div>
			</section>

			<!-- CONTENIDO DEL PERFIL -->
			<section id="profile-content">
				<!-- Información del usuario -->
				<article class="profile-info-card">
					<header class="profile-header">
						<div class="profile-avatar">
							<i class="fa-solid fa-user-doctor"></i>
						</div>
						<div class="profile-header-text">
							<h2 class="profile-name" id="userName">
								Cargando...
							</h2>
							<p class="profile-role" id="userRole">Usuario</p>
						</div>
						<button
							class="btn btn-outline-primary btn-edit"
							id="editProfileBtn"
						>
							<i class="fa-solid fa-pen"></i>
							<span>Editar perfil</span>
						</button>
					</header>

					<article class="profile-details">
						<div class="detail-group">
							<h3 class="divider-title">Información Personal</h3>
							<div class="detail-grid">
								<div class="detail-item">
									<i class="fa-solid fa-envelope"></i>
									<div>
										<span class="detail-label"
											>Correo electrónico</span
										>
										<span
											class="detail-value"
											id="userEmail"
											>correo@ejemplo.com</span
										>
									</div>
								</div>
								<div class="detail-item">
									<i class="fa-solid fa-phone"></i>
									<div>
										<span class="detail-label"
											>Teléfono</span
										>
										<span
											class="detail-value"
											id="userPhone"
											>No especificado</span
										>
									</div>
								</div>
								<div class="detail-item">
									<i class="fa-solid fa-id-card"></i>
									<div>
										<span class="detail-label">DNI</span>
										<span class="detail-value" id="userDNI"
											>No especificado</span
										>
									</div>
								</div>
								<div class="detail-item">
									<i class="fa-solid fa-calendar"></i>
									<div>
										<span class="detail-label"
											>Fecha de registro</span
										>
										<span
											class="detail-value"
											id="userRegDate"
											>01/01/2024</span
										>
									</div>
								</div>
							</div>
						</div>

				

				

				
			</section>
		</main>

		<!-- FOOTER -->
		<footer id="footer-placeholder" class="footer"></footer>

		<!-- SCRIPTS -->
		<!-- 1. FontAwesome -->
		<script
			src="https://kit.fontawesome.com/d8c2b7ce4c.js"
			crossorigin="anonymous"
		></script>

		<!-- 2. Bootstrap Bundle (incluye Popper) -->
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"
		></script>

		<!-- 3. Sistema de usuarios ANTES de layout.js -->
		<script src="../js/register/registerSimulation.js"></script>
		<script src="../js/register/json-loader.js"></script>

		<!-- 4. Layout.js después de todo -->
		<script src="../js/layout.js"></script>

		<!-- 5. UserProfile al final -->
		<script src="../js/userProfile.js"></script>
	</body>
</html>
